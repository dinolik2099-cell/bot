project:
  initial_capital: 10000.0
  target_capital: 90000.0
  target_days: [180, 200, 240]
  base_interval: 1h
  timezone: UTC

universe:
  symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - XRPUSDT
    - DOGEUSDT
  min_quote_volume: 10000000

costs:
  fee_rate: 0.0004
  slippage_bps: 2.0

risk:
  risk_per_trade: [0.0025, 0.005, 0.0075, 0.01]
  max_position_pct: [0.20, 0.30, 0.50]
  max_portfolio_risk: 0.01
  max_positions: [1, 2, 3]
  max_drawdown_stop: 0.10
  consecutive_loss_reduce_after: 3
  reduced_risk_multiplier: 0.70

strategies:
  trend_breakout:
    enabled: true
    lookback: [20, 40, 60]
    atr_period: [14]
    stop_atr: [1.5, 2.0, 2.5]
    reward_r: [2.5, 3.0, 4.0]
  trend_pullback:
    enabled: true
    ema_fast: [20, 30]
    ema_slow: [80, 120]
    atr_period: [14]
    stop_atr: [1.5, 2.0]
    reward_r: [2.5, 3.0]
  volatility_breakout:
    enabled: true
    range_lookback: [20, 40]
    atr_period: [14]
    stop_atr: [1.5, 2.0]
    reward_r: [2.5, 3.0]
  mean_reversion:
    enabled: true
    lookback: [20, 40]
    z_entry: [2.0, 2.5, 3.0]
    z_exit: [0.5, 1.0]
    stop_atr: [2.0]

research:
  workers: 0
  train_end: '2024-12-31'
  validation_end: '2025-12-31'
  oos_end: '2026-08-31'
  target_days: 200
